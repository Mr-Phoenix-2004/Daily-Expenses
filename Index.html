<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Daily Expenses</title>
    
    <!-- Meta tags for native app feel -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Expenses">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    
    <!-- Dynamic Web App Manifest for strict Fullscreen Native App Mode -->
    <script>
        (function() {
            const manifest = {
                "name": "Daily Expenses Management",
                "short_name": "Expenses",
                "start_url": window.location.href,
                "display": "fullscreen",
                "orientation": "portrait",
                "background_color": "#f8fafc",
                "theme_color": "#4f46e5",
                "icons": [
                    {
                        "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>",
                        "sizes": "192x192",
                        "type": "image/svg+xml",
                        "purpose": "any maskable"
                    },
                    {
                        "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>",
                        "sizes": "512x512",
                        "type": "image/svg+xml",
                        "purpose": "any maskable"
                    }
                ]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const manifestUrl = URL.createObjectURL(blob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestUrl;
            document.head.appendChild(link);
        })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        primary: '#4f46e5',
                        success: '#10b981',
                        danger: '#ef4444',
                        surface: { light: '#ffffff', dark: '#1e293b' },
                        background: { light: '#f8fafc', dark: '#0f172a' }
                    },
                    spacing: {
                        'safe-bottom': 'env(safe-area-inset-bottom)',
                        'safe-top': 'env(safe-area-inset-top)'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS for scrollbars, chat preview, and app-like animations -->
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; user-select: none; }
        input, textarea { user-select: auto; }
        
        html { scroll-behavior: smooth; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media (min-width: 768px) {
            ::-webkit-scrollbar { width: 8px; height: 8px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
            .dark ::-webkit-scrollbar-thumb { background: #475569; }
        }

        /* App Animations */
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Splash Screen Animations */
        @keyframes splashFadeOut { 0% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .splash-container { animation: splashFadeOut 0.4s ease-in-out 1.8s forwards; }
        .splash-logo { animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>

    <!-- Import Maps for React and dependencies -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.294.0",
                "jspdf": "https://esm.sh/jspdf@2.5.1",
                "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.1",
                "date-fns": "https://esm.sh/date-fns@2.30.0"
            }
        }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useCallback, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Home, PlusCircle, History as HistoryIcon, Settings as SettingsIcon, 
            FileText, Share2, Copy, Trash2, Edit2, Plus, X, Moon, Sun, 
            Download, Upload, Check, Calendar, Coffee, ShoppingCart, 
            Pill, Car, Home as HomeIcon, User, MoreHorizontal, ArrowRightLeft, Files 
        } from 'lucide-react';
        import { jsPDF } from 'jspdf';
        import autoTable from 'jspdf-autotable';
        import { format, parseISO, isValid } from 'date-fns';

        const DEFAULT_SETTINGS = {
            theme: 'light',
            currency: '₹',
            carryForwardBalance: true,
            reportTitle: 'Daily Expense Report',
            closingMessage: 'Thank you.',
            showCategories: false,
            showNotes: true,
            quickExpenses: [
                { name: 'Milk', category: 'Grocery' },
                { name: 'Tea', category: 'Tea' },
                { name: 'Petrol', category: 'Transport' },
                { name: 'Medical', category: 'Medical' }
            ]
        };

        const CATEGORIES = ['Food', 'Grocery', 'Medical', 'Transport', 'Household', 'Personal', 'Tea', 'Other'];
        
        const CATEGORY_ICONS = {
            'Food': <Coffee size={16} />,
            'Grocery': <ShoppingCart size={16} />,
            'Medical': <Pill size={16} />,
            'Transport': <Car size={16} />,
            'Household': <HomeIcon size={16} />,
            'Personal': <User size={16} />,
            'Tea': <Coffee size={16} />,
            'Other': <MoreHorizontal size={16} />
        };

        const CATEGORY_EMOJIS = {
            'Food': '🍲',
            'Grocery': '🛍️',
            'Medical': '💊',
            'Transport': '🚕',
            'Household': '🏠',
            'Personal': '👤',
            'Tea': '☕',
            'Other': '🔹'
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);
        
        const formatCurrency = (amount, currency = '₹') => {
            return `${currency}${parseFloat(amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        };

        const calculateTotals = (report) => {
            if (!report) return { totalReceived: 0, totalExpenses: 0, closingBalance: 0, opening: 0 };
            const totalReceived = (report.received || []).reduce((sum, item) => sum + parseFloat(item.amount || 0), 0);
            const totalExpenses = (report.expenses || []).reduce((sum, item) => sum + parseFloat(item.amount || 0), 0);
            const opening = parseFloat(report.openingBalance || 0);
            const closingBalance = opening + totalReceived - totalExpenses;
            return { totalReceived, totalExpenses, closingBalance, opening };
        };

        const generateWhatsAppText = (report, settings) => {
            const { totalReceived, totalExpenses, closingBalance, opening } = calculateTotals(report);
            const dateObj = parseISO(report.date);
            const fullDateStr = format(dateObj, 'dd MMMM yyyy');
            const dayStr = format(dateObj, 'EEEE');
            
            let msg = `*${settings.reportTitle.toUpperCase()}*\n`;
            msg += `Date: ${fullDateStr}\n`;
            msg += `Day: ${dayStr}\n`;
            msg += `━━━━━━━━━━━━━━━━━━━━\n\n`;
            
            if (opening > 0) {
                msg += `*Opening Balance:* ${formatCurrency(opening, settings.currency)}\n\n`;
            }

            if (report.received && report.received.length > 0) {
                msg += `*Money Received*\n`;
                report.received.forEach(r => {
                    msg += `• ${r.source} - ${formatCurrency(r.amount, settings.currency)}\n`;
                });
                msg += `\n`;
            }

            msg += `*EXPENSES*\n`;
            msg += `────────────────────\n`;
            if (report.expenses && report.expenses.length > 0) {
                report.expenses.forEach((e, i) => {
                    let noteStr = settings.showNotes && e.note ? ` (${e.note})` : '';
                    msg += `${i + 1}. ${e.name}${noteStr} - ${formatCurrency(e.amount, settings.currency)}\n`;
                });
            } else {
                msg += `• No expenses\n`;
            }
            msg += `────────────────────\n\n`;

            msg += `*Total Expenses:* ${formatCurrency(totalExpenses, settings.currency)}\n\n`;
            
            msg += `*Closing Balance:* ${formatCurrency(closingBalance, settings.currency)}\n\n`;
            
            if (settings.closingMessage) {
                msg += `${settings.closingMessage}`;
            }
            
            return msg.trim();
        };

        const formatWhatsAppPreview = (text) => {
            // Parses WhatsApp bold markdown (*) for the UI preview
            return text.split(/(\*[^\*]+\*)/g).map((part, i) => {
                if (part.startsWith('*') && part.endsWith('*')) {
                    return <strong key={i} className="font-semibold text-slate-900 dark:text-white">{part.slice(1, -1)}</strong>;
                }
                return <span key={i}>{part}</span>;
            });
        };

        const generatePDF = (report, settings) => {
            try {
                const doc = new jsPDF();
                const { totalReceived, totalExpenses, closingBalance, opening } = calculateTotals(report);
                const dateStr = format(parseISO(report.date), 'dd MMMM yyyy');
                
                // jsPDF struggles with ₹ symbol, replacing safely for the PDF rendering.
                const safeCurrency = (amount) => formatCurrency(amount, settings.currency).replace('₹', 'Rs. ');

                // Title & Date
                doc.setFontSize(18);
                doc.setTextColor(30, 41, 59);
                doc.text(settings.reportTitle.toUpperCase(), 14, 22);
                doc.setFontSize(11);
                doc.setTextColor(100, 116, 139);
                doc.text(`Date: ${dateStr}`, 14, 30);

                let currentY = 40;
                
                // Summary Box
                doc.setFillColor(248, 250, 252);
                doc.roundedRect(14, currentY, 181, 25, 3, 3, 'FD');
                doc.setFontSize(11);
                doc.setTextColor(30, 41, 59);
                doc.text(`Opening Balance: ${safeCurrency(opening)}  |  Total Expenses: ${safeCurrency(totalExpenses)}  |  Closing Balance: ${safeCurrency(closingBalance)}`, 20, currentY + 16);
                
                currentY += 35;

                // Received Table
                if (report.received && report.received.length > 0) {
                    const receivedBody = report.received.map(r => [`${r.source} Paid`, safeCurrency(r.amount)]);
                    autoTable(doc, {
                        startY: currentY,
                        head: [['Money Received', 'Amount']],
                        body: receivedBody,
                        theme: 'grid',
                        headStyles: { fillColor: [241, 245, 249], textColor: [30, 41, 59] },
                        columnStyles: { 1: { halign: 'right', fontStyle: 'bold' } },
                        margin: { left: 14, right: 14 }
                    });
                    currentY = doc.lastAutoTable.finalY + 10;
                }

                // Expenses Table
                if (report.expenses && report.expenses.length > 0) {
                    const expensesBody = report.expenses.map((e, i) => [
                        i + 1, e.name + (e.note ? `\n(${e.note})` : ''), e.category || '-', safeCurrency(e.amount)
                    ]);
                    autoTable(doc, {
                        startY: currentY,
                        head: [['#', 'Expense', 'Category', 'Amount']],
                        body: expensesBody,
                        theme: 'striped',
                        headStyles: { fillColor: [79, 70, 229], textColor: [255, 255, 255] },
                        columnStyles: { 0: { cellWidth: 15 }, 3: { halign: 'right', fontStyle: 'bold' } },
                        margin: { left: 14, right: 14 }
                    });
                }
                
                doc.save(`Expense_Report_${dateStr.replace(/\s/g, '_')}.pdf`);
            } catch (err) {
                console.error("PDF Generation Error:", err);
                alert("Failed to generate PDF. Make sure all fields are valid.");
            }
        };

        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) { console.error(error); }
            };
            return [storedValue, setValue];
        };

        const ToastContext = React.createContext();
        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            const addToast = useCallback((message, type = 'success') => {
                const id = generateId();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
            }, []);

            return (
                <ToastContext.Provider value={addToast}>
                    {children}
                    <div className="fixed top-safe-top right-4 mt-4 z-[9999] flex flex-col gap-2 pointer-events-none">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`slide-in-right flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-white pointer-events-auto ${toast.type === 'success' ? 'bg-success' : 'bg-danger'}`}>
                                {toast.type === 'success' && <Check size={18} />}
                                <span className="font-medium text-sm">{toast.message}</span>
                            </div>
                        ))}
                    </div>
                </ToastContext.Provider>
            );
        };
        const useToast = () => React.useContext(ToastContext);

        const Card = ({ children, className = '', onClick }) => (
            <div onClick={onClick} className={`bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-4 ${onClick ? 'cursor-pointer hover:shadow-md transition-shadow' : ''} ${className}`}>
                {children}
            </div>
        );

        const Button = ({ children, variant = 'primary', className = '', icon: Icon, ...props }) => {
            const baseStyle = "flex items-center justify-center gap-2 px-4 py-2 rounded-lg font-medium transition-all active:scale-95";
            const variants = {
                primary: "bg-primary text-white hover:bg-indigo-700 shadow-sm",
                secondary: "bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700",
                danger: "bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/40",
                ghost: "text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800",
                outline: "border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800"
            };
            return (
                <button className={`${baseStyle} ${variants[variant]} ${className}`} {...props}>
                    {Icon && <Icon size={18} />}
                    {children}
                </button>
            );
        };

        const Input = ({ label, icon: Icon, className = '', ...props }) => (
            <div className={`flex flex-col gap-1.5 ${className}`}>
                {label && <label className="text-sm font-medium text-slate-700 dark:text-slate-300">{label}</label>}
                <div className="relative">
                    {Icon && <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon size={18} /></div>}
                    <input className={`w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-4 py-2.5 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all ${Icon ? 'pl-10' : ''}`} {...props} />
                </div>
            </div>
        );

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center fade-in">
                    <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full md:max-w-md bg-surface-light dark:bg-surface-dark rounded-t-2xl md:rounded-2xl shadow-xl slide-up max-h-[90vh] flex flex-col pb-safe-bottom">
                        <div className="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-800">
                            <h3 className="font-semibold text-lg">{title}</h3>
                            <button onClick={onClose} className="p-2 text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full"><X size={20} /></button>
                        </div>
                        <div className="p-4 overflow-y-auto no-scrollbar">{children}</div>
                    </div>
                </div>
            );
        };

        const DashboardView = ({ reports, onNavigate, settings, installPrompt, onInstall }) => {
            const todayStr = format(new Date(), 'yyyy-MM-dd');
            const todayReport = reports.find(r => r.date === todayStr);
            const { totalReceived, totalExpenses, closingBalance } = calculateTotals(todayReport);

            return (
                <div className="p-4 pt-safe-top md:p-8 max-w-5xl mx-auto pb-28 md:pb-8 slide-up">
                    <header className="mb-8 flex flex-wrap justify-between items-end gap-4 mt-2">
                        <div>
                            <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Dashboard</h1>
                            <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">{format(new Date(), 'EEEE, dd MMMM yyyy')}</p>
                        </div>
                        <div className="flex items-center gap-2">
                            {/* NATIVE OS INSTALL BUTTON - Only shows if device allows automatic 1-click download */}
                            {installPrompt && (
                                <button 
                                    onClick={onInstall} 
                                    className="px-4 py-2 bg-indigo-600 text-white hover:bg-indigo-700 rounded-lg flex items-center gap-2 transition-all shadow shadow-indigo-200 dark:shadow-none"
                                >
                                    <Download size={18} />
                                    <span className="font-semibold text-sm">Download App</span>
                                </button>
                            )}
                        </div>
                    </header>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <Card className="bg-gradient-to-br from-indigo-500 to-primary text-white border-none shadow-indigo-200 dark:shadow-none">
                            <div className="text-indigo-100 text-sm font-medium mb-1">Total Available</div>
                            <div className="text-2xl font-bold">{formatCurrency((todayReport?.openingBalance || 0) + totalReceived, settings.currency)}</div>
                        </Card>
                        <Card>
                            <div className="text-slate-500 text-sm font-medium mb-1 flex items-center gap-1"><ArrowRightLeft size={14}/> Received</div>
                            <div className="text-2xl font-bold">{formatCurrency(totalReceived, settings.currency)}</div>
                        </Card>
                        <Card>
                            <div className="text-slate-500 text-sm font-medium mb-1 flex items-center gap-1"><ShoppingCart size={14}/> Spent</div>
                            <div className="text-2xl font-bold text-danger">{formatCurrency(totalExpenses, settings.currency)}</div>
                        </Card>
                        <Card>
                            <div className="text-slate-500 text-sm font-medium mb-1">Closing Balance</div>
                            <div className="text-2xl font-bold text-primary">{formatCurrency(closingBalance, settings.currency)}</div>
                        </Card>
                    </div>

                    <div className="flex items-center justify-between mb-4">
                        <h2 className="text-lg font-bold">Today's Report</h2>
                        {todayReport && (
                            <Button variant="ghost" onClick={() => onNavigate('new')} className="text-sm">Edit Today</Button>
                        )}
                    </div>

                    {todayReport ? (
                        <div className="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
                            {todayReport.expenses.length > 0 ? (
                                <div className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {todayReport.expenses.map(exp => (
                                        <div key={exp.id} className="p-4 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-800/50">
                                            <div className="flex items-center gap-3">
                                                <div className="p-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-slate-500">
                                                    {CATEGORY_ICONS[exp.category] || <MoreHorizontal size={18}/>}
                                                </div>
                                                <div>
                                                    <div className="font-medium">{exp.name}</div>
                                                    <div className="text-xs text-slate-500">{exp.category} {exp.note && `• ${exp.note}`}</div>
                                                </div>
                                            </div>
                                            <div className="font-semibold">{formatCurrency(exp.amount, settings.currency)}</div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="p-8 text-center text-slate-500">
                                    <FileText size={48} className="mx-auto mb-3 opacity-20" />
                                    <p>No expenses added yet today.</p>
                                </div>
                            )}
                        </div>
                    ) : (
                        <Card className="text-center p-8 border-dashed">
                            <div className="mx-auto w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mb-4 text-primary"><Plus size={32} /></div>
                            <h3 className="text-lg font-medium mb-2">No report for today</h3>
                            <Button onClick={() => onNavigate('new')} className="mx-auto">Create Today's Report</Button>
                        </Card>
                    )}
                </div>
            );
        };

        const DailyReportView = ({ reports, setReports, settings, editingId, onNavigate }) => {
            const toast = useToast();
            const [report, setReport] = useState(() => {
                if (editingId) {
                    const existing = reports.find(r => r.id === editingId);
                    if (existing) return JSON.parse(JSON.stringify(existing));
                }
                const todayStr = format(new Date(), 'yyyy-MM-dd');
                const existingToday = reports.find(r => r.date === todayStr);
                if (existingToday) return JSON.parse(JSON.stringify(existingToday));

                let initialOpening = 0;
                if (settings.carryForwardBalance && reports.length > 0) {
                    const sortedReports = [...reports].sort((a, b) => new Date(b.date) - new Date(a.date));
                    const latestReport = sortedReports[0];
                    if (latestReport.date !== todayStr) {
                        initialOpening = calculateTotals(latestReport).closingBalance;
                    }
                }
                return { id: todayStr, date: todayStr, openingBalance: initialOpening, received: [], expenses: [] };
            });

            const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [expForm, setExpForm] = useState({ name: '', amount: '', category: 'Grocery', note: '' });

            const { totalReceived, totalExpenses, closingBalance } = calculateTotals(report);

            useEffect(() => {
                const newReports = [...reports];
                const index = newReports.findIndex(r => r.id === report.id);
                if (index >= 0) newReports[index] = report;
                else newReports.push(report);
                newReports.sort((a, b) => new Date(b.date) - new Date(a.date));
                setReports(newReports);
            }, [report]);

            const handleAddExpense = (e) => {
                e.preventDefault();
                if (!expForm.name || !expForm.amount || isNaN(expForm.amount) || expForm.amount <= 0) return toast('Invalid expense', 'error');
                
                const newExp = { id: editingItem ? editingItem.id : generateId(), name: expForm.name, amount: parseFloat(expForm.amount), category: expForm.category, note: expForm.note };
                setReport(prev => ({ ...prev, expenses: editingItem ? prev.expenses.map(ex => ex.id === newExp.id ? newExp : ex) : [...prev.expenses, newExp] }));
                
                toast(editingItem ? 'Updated' : 'Added');
                setIsExpenseModalOpen(false);
                setExpForm({ name: '', amount: '', category: 'Grocery', note: '' });
                setEditingItem(null);
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard!')).catch(() => {
                    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('Copied to clipboard!');
                });
            };

            return (
                <div className="p-4 pt-safe-top md:p-8 max-w-4xl mx-auto pb-32 md:pb-8 slide-up">
                    <header className="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <input type="date" value={report.date} onChange={e => setReport(prev => ({...prev, date: e.target.value, id: e.target.value}))} className="bg-transparent text-xl font-bold outline-none cursor-pointer" />
                        <div className="flex gap-2">
                            <Button variant="outline" onClick={() => copyToClipboard(generateWhatsAppText(report, settings))} icon={Copy} className="flex-1 md:flex-none">Copy</Button>
                            <Button variant="outline" onClick={() => generatePDF(report, settings)} icon={FileText} className="flex-1 md:flex-none">PDF</Button>
                        </div>
                    </header>

                    <div className="grid md:grid-cols-3 gap-6 mb-8">
                        <div className="space-y-4 md:col-span-1">
                            <Card className="bg-slate-50 dark:bg-slate-800/50">
                                <div>
                                    <label className="text-sm font-medium text-slate-500">Opening Balance</label>
                                    <div className="relative mt-1">
                                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">{settings.currency}</span>
                                        <input type="number" value={report.openingBalance || ''} onChange={e => setReport(prev => ({...prev, openingBalance: parseFloat(e.target.value) || 0}))} className="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg pl-8 pr-4 py-2 font-medium focus:ring-2 focus:ring-primary outline-none" />
                                    </div>
                                </div>
                                <div className="flex justify-between items-center border-t border-slate-200 dark:border-slate-700 pt-3 mt-4 text-lg">
                                    <span className="font-bold">Closing Balance</span>
                                    <span className="font-bold text-primary">{formatCurrency(closingBalance, settings.currency)}</span>
                                </div>
                            </Card>
                        </div>

                        <div className="md:col-span-2 space-y-4">
                            <div className="flex justify-between items-center">
                                <h2 className="text-lg font-bold">Expenses ({report.expenses.length})</h2>
                                <Button onClick={() => { setEditingItem(null); setExpForm({name:'', amount:'', category:'Grocery', note:''}); setIsExpenseModalOpen(true); }} icon={Plus}>Add Expense</Button>
                            </div>

                            {report.expenses.length === 0 ? (
                                <div className="bg-white dark:bg-slate-900 border border-dashed border-slate-300 dark:border-slate-700 rounded-xl p-10 text-center">
                                    <p className="text-slate-500 font-medium">No expenses recorded today.</p>
                                </div>
                            ) : (
                                <div className="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden divide-y divide-slate-100 dark:divide-slate-800">
                                    {report.expenses.map(exp => (
                                        <div key={exp.id} className="p-4 flex justify-between items-center">
                                            <div className="flex gap-3">
                                                <div className="p-2 bg-slate-100 dark:bg-slate-800 rounded-lg">{CATEGORY_ICONS[exp.category] || <MoreHorizontal size={16}/>}</div>
                                                <div>
                                                    <div className="font-semibold">{exp.name}</div>
                                                    <div className="text-xs text-slate-500">{exp.category}</div>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <div className="font-bold">{formatCurrency(exp.amount, settings.currency)}</div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => { setEditingItem(exp); setExpForm({ name: exp.name, amount: exp.amount.toString(), category: exp.category, note: exp.note || '' }); setIsExpenseModalOpen(true); }} className="text-slate-400 hover:text-primary"><Edit2 size={16}/></button>
                                                    <button onClick={() => setReport(prev => ({...prev, expenses: prev.expenses.filter(e => e.id !== exp.id)}))} className="text-slate-400 hover:text-danger"><Trash2 size={16}/></button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Styled WhatsApp Preview */}
                    <div className="mt-8 pt-8 border-t border-slate-200 dark:border-slate-800">
                        <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                            <FileText size={16}/> Chat Preview
                        </h3>
                        <div className="relative max-w-sm mx-auto">
                            <div className="absolute inset-0 bg-[#efeae2] dark:bg-[#0b141a] rounded-2xl overflow-hidden shadow-inner border border-slate-200 dark:border-slate-700"></div>
                            <div className="relative p-4 pb-6">
                                <div className="bg-white dark:bg-[#202c33] rounded-2xl rounded-tl-sm p-4 shadow-[0_1px_2px_rgba(0,0,0,0.1)] dark:shadow-none text-[15px] leading-relaxed whitespace-pre-wrap font-sans text-[#111b21] dark:text-[#e9edef] w-[95%]">
                                    <div className="absolute top-0 left-[-8px] w-0 h-0 border-[10px] border-transparent border-t-white dark:border-t-[#202c33] border-r-white dark:border-r-[#202c33]"></div>
                                    {formatWhatsAppPreview(generateWhatsAppText(report, settings))}
                                    <div className="float-right mt-1 ml-3 text-[11px] text-[#667781] flex items-center gap-1">{format(new Date(), 'HH:mm')}</div>
                                    <div className="clear-both"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Mobile Floating Button */}
                    <div className="md:hidden fixed bottom-24 right-4 z-40">
                        <button onClick={() => { setEditingItem(null); setExpForm({name:'', amount:'', category:'Grocery', note:''}); setIsExpenseModalOpen(true); }} className="bg-primary text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center active:scale-95 transition-all"><Plus size={28} /></button>
                    </div>

                    <Modal isOpen={isExpenseModalOpen} onClose={() => setIsExpenseModalOpen(false)} title={editingItem ? "Edit Expense" : "Add Expense"}>
                        <form onSubmit={handleAddExpense} className="space-y-4">
                            <Input label="Expense Name" placeholder="e.g. Milk" value={expForm.name} onChange={e => setExpForm(prev => ({...prev, name: e.target.value}))} autoFocus required />
                            <Input label="Amount" type="number" step="any" placeholder="0.00" icon={() => <span className="text-slate-500">{settings.currency}</span>} value={expForm.amount} onChange={e => setExpForm(prev => ({...prev, amount: e.target.value}))} required />
                            <div>
                                <label className="text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5 block">Category</label>
                                <div className="grid grid-cols-4 gap-2">
                                    {CATEGORIES.map(cat => (
                                        <button key={cat} type="button" onClick={() => setExpForm(prev => ({...prev, category: cat}))} className={`flex flex-col items-center justify-center p-2 rounded-lg border text-xs gap-1 ${expForm.category === cat ? 'bg-primary/10 border-primary text-primary' : 'bg-white border-slate-200'}`}>
                                            {CATEGORY_ICONS[cat]} <span className="truncate">{cat}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <Button type="submit" className="w-full mt-4 py-3">{editingItem ? 'Update' : 'Add'} Expense</Button>
                        </form>
                    </Modal>
                </div>
            );
        };

        const HistoryView = ({ reports, setReports, onNavigate, settings }) => (
            <div className="p-4 pt-safe-top md:p-8 max-w-4xl mx-auto pb-24 slide-up">
                <h1 className="text-2xl font-bold mb-6 mt-2">History</h1>
                <div className="space-y-4">
                    {reports.map(report => (
                        <Card key={report.id} className="flex justify-between items-center group">
                            <div className="flex gap-4">
                                <div className="bg-primary/10 text-primary rounded-lg p-3 text-center min-w-[70px]">
                                    <div className="text-sm font-bold uppercase">{format(parseISO(report.date), 'MMM')}</div>
                                    <div className="text-2xl font-black leading-none">{format(parseISO(report.date), 'dd')}</div>
                                </div>
                                <div>
                                    <div className="text-sm text-slate-500 mb-1">Spent: <span className="font-semibold text-danger">{formatCurrency(calculateTotals(report).totalExpenses, settings.currency)}</span></div>
                                    <div className="text-lg font-bold">Balance: <span className="text-primary">{formatCurrency(calculateTotals(report).closingBalance, settings.currency)}</span></div>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <Button variant="ghost" onClick={() => onNavigate('new', report.id)}><Edit2 size={18}/></Button>
                            </div>
                        </Card>
                    ))}
                </div>
            </div>
        );

        const SettingsView = ({ settings, setSettings }) => {
            const toggleTheme = () => {
                const t = settings.theme === 'light' ? 'dark' : 'light';
                setSettings(prev => ({ ...prev, theme: t }));
                if(t === 'dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
            };
            return (
                <div className="p-4 pt-safe-top md:p-8 max-w-3xl mx-auto pb-24 slide-up">
                    <h1 className="text-2xl font-bold mb-6 mt-2">Settings</h1>
                    <Card className="mb-4">
                        <h2 className="text-lg font-semibold mb-4 border-b pb-2">Appearance</h2>
                        <div className="flex justify-between items-center py-2">
                            <span>Dark Mode</span>
                            <Button variant="outline" onClick={toggleTheme} icon={settings.theme === 'light' ? Moon : Sun}>Toggle</Button>
                        </div>
                    </Card>
                    <Card>
                        <h2 className="text-lg font-semibold mb-4 border-b pb-2">Preferences</h2>
                        <Input label="Currency Symbol" value={settings.currency} onChange={e => setSettings(prev => ({...prev, currency: e.target.value}))} />
                        <Input label="Report Title" value={settings.reportTitle} onChange={e => setSettings(prev => ({...prev, reportTitle: e.target.value}))} className="mt-4" />
                        <Input label="Closing Message" value={settings.closingMessage} onChange={e => setSettings(prev => ({...prev, closingMessage: e.target.value}))} className="mt-4" />
                    </Card>
                </div>
            );
        };

        const App = () => {
            const [currentTab, setCurrentTab] = useState('dashboard');
            const [editingReportId, setEditingReportId] = useState(null);
            const [showSplash, setShowSplash] = useState(true);
            const [installPrompt, setInstallPrompt] = useState(null);
            const [reports, setReports] = useLocalStorage('expenses_reports', [{ id: format(new Date(), 'yyyy-MM-dd'), date: format(new Date(), 'yyyy-MM-dd'), openingBalance: 10000, received: [], expenses: [{id:'e1', name:'auto', category:'Transport', amount: 20}, {id:'e2', name:'Milk', category:'Grocery', amount: 50}] }]);
            const [settings, setSettings] = useLocalStorage('expenses_settings', DEFAULT_SETTINGS);

            useEffect(() => {
                if (settings.theme === 'dark') document.documentElement.classList.add('dark');
                setTimeout(() => setShowSplash(false), 2200);

                // Silently capture the native app install prompt
                const handleBeforeInstall = (e) => {
                    e.preventDefault(); 
                    setInstallPrompt(e); 
                };
                window.addEventListener('beforeinstallprompt', handleBeforeInstall);
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
            }, []);

            const handleInstallApp = async () => {
                if (!installPrompt) return;
                installPrompt.prompt();
                const { outcome } = await installPrompt.userChoice;
                if (outcome === 'accepted') {
                    setInstallPrompt(null); // Hide button once installed
                }
            };

            const navigate = (tab, id = null) => { setCurrentTab(tab); setEditingReportId(id); window.scrollTo(0, 0); };

            const NavItem = ({ tab, icon: Icon, label }) => {
                const isActive = currentTab === tab;
                return (
                    <button onClick={() => navigate(tab)} className={`flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:p-3 md:px-4 rounded-xl transition-all ${isActive ? 'text-primary bg-primary/10 font-semibold' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                        <Icon size={isActive ? 24 : 22} className="md:w-5 md:h-5 transition-transform" />
                        <span className="text-[10px] md:text-sm font-medium">{label}</span>
                    </button>
                );
            };

            return (
                <ToastProvider>
                    {showSplash && (
                        <div className="fixed inset-0 z-[100] bg-primary flex flex-col items-center justify-center text-white splash-container">
                            <div className="splash-logo bg-white/10 p-6 rounded-3xl backdrop-blur-md border border-white/20 mb-4"><Files size={64} /></div>
                            <h1 className="text-3xl font-bold">Daily Expenses</h1>
                        </div>
                    )}
                    <div className="min-h-screen flex flex-col md:flex-row pb-safe-bottom">
                        <aside className="hidden md:flex flex-col w-64 fixed inset-y-0 left-0 bg-surface-light dark:bg-surface-dark border-r border-slate-200 dark:border-slate-800 z-30 pt-safe-top">
                            <div className="p-6 flex items-center gap-3 text-primary font-bold text-xl"><div className="bg-primary text-white p-2 rounded-lg"><Files size={24} /></div> Expenses</div>
                            <nav className="flex-1 px-4 space-y-2">
                                <NavItem tab="dashboard" icon={Home} label="Dashboard" />
                                <NavItem tab="new" icon={PlusCircle} label="Add Expense" />
                                <NavItem tab="history" icon={HistoryIcon} label="History" />
                                {installPrompt && (
                                    <button onClick={handleInstallApp} className="w-full flex items-center gap-3 p-3 px-4 rounded-xl transition-all text-indigo-600 bg-indigo-50 dark:bg-indigo-900/20 hover:bg-indigo-100 dark:hover:bg-indigo-900/40 font-semibold mt-4">
                                        <Download size={20} />
                                        <span className="text-sm">Download App</span>
                                    </button>
                                )}
                            </nav>
                            <div className="p-4 border-t space-y-2"><NavItem tab="settings" icon={SettingsIcon} label="Settings" /></div>
                        </aside>
                        <main className="flex-1 md:ml-64 min-h-screen">
                            {currentTab === 'dashboard' && <DashboardView reports={reports} onNavigate={navigate} settings={settings} installPrompt={installPrompt} onInstall={handleInstallApp} />}
                            {currentTab === 'new' && <DailyReportView reports={reports} setReports={setReports} settings={settings} editingId={editingReportId} onNavigate={navigate} />}
                            {currentTab === 'history' && <HistoryView reports={reports} onNavigate={navigate} settings={settings} />}
                            {currentTab === 'settings' && <SettingsView settings={settings} setSettings={setSettings} />}
                        </main>
                        <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-surface-light/95 dark:bg-surface-dark/95 backdrop-blur-md border-t flex justify-around items-center p-2 pb-safe-bottom z-30">
                            <NavItem tab="dashboard" icon={Home} label="Home" />
                            <NavItem tab="new" icon={PlusCircle} label="Add" />
                            <NavItem tab="history" icon={HistoryIcon} label="History" />
                            <NavItem tab="settings" icon={SettingsIcon} label="Settings" />
                        </nav>
                    </div>
                </ToastProvider>
            );
        };
        const root = createRoot(document.getElementById('root')); root.render(<App />);
    </script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'expenses-app-v1';
                    const ASSETS = ['./', 'https://cdn.tailwindcss.com', 'https://unpkg.com/@babel/standalone/babel.min.js'];
                    self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(ASSETS))));
                    self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(res => res || fetch(e.request))));
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob))
                    .then(() => console.log('Offline ready & PWA Installable.'))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
