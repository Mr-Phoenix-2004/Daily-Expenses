<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Expenses Report</title>
    
    <!-- Meta tags for PWA/Installable feel -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    
    <!-- Inline Web App Manifest for PWA support -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Daily Expenses App","short_name":"Expenses","start_url":".","display":"standalone","background_color":"#f8fafc","theme_color":"#4f46e5","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>","sizes":"512x512","type":"image/svg+xml"}]}'>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4f46e5',
                        success: '#10b981',
                        danger: '#ef4444',
                        surface: {
                            light: '#ffffff',
                            dark: '#1e293b'
                        },
                        background: {
                            light: '#f8fafc',
                            dark: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS for scrollbars and animations -->
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Smooth scrolling */
        html { scroll-behavior: smooth; }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom scrollbar for desktop */
        @media (min-width: 768px) {
            ::-webkit-scrollbar { width: 8px; height: 8px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
            .dark ::-webkit-scrollbar-thumb { background: #475569; }
            ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide-in-right { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Splash Screen Animations */
        @keyframes splashFadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes floatEffect {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .splash-container { animation: splashFadeOut 0.5s ease-in-out 2s forwards; }
        .splash-logo { animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards, floatEffect 3s ease-in-out 0.6s infinite; }

        /* Glass effect */
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .dark .glass { background: rgba(30, 41, 59, 0.8); }
    </style>

    <!-- Import Maps for React and dependencies -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.294.0",
                "jspdf": "https://esm.sh/jspdf@2.5.1",
                "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.1",
                "date-fns": "https://esm.sh/date-fns@2.30.0"
            }
        }
    </script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useCallback, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Home, PlusCircle, History as HistoryIcon, Settings as SettingsIcon, 
            FileText, Share2, Copy, Trash2, Edit2, Plus, X, Moon, Sun, 
            Download, Upload, Check, ChevronRight, ChevronLeft, Calendar,
            Coffee, ShoppingCart, Pill, Car, Home as HomeIcon, User, MoreHorizontal, ArrowRightLeft, Files,
            PlusSquare
        } from 'lucide-react';
        import { jsPDF } from 'jspdf';
        import autoTable from 'jspdf-autotable';
        import { format, parseISO, isValid, isSameDay } from 'date-fns';

        // --- SAMPLE DATA ---
        const SAMPLE_DATA = [
            {
                id: '2026-09-13',
                date: '2026-09-13',
                openingBalance: 307.00,
                received: [
                    { id: 'r1', source: 'Sir', amount: 1000.00 },
                    { id: 'r2', source: 'Madam', amount: 5000.00 }
                ],
                expenses: [
                    { id: 'e1', name: 'Mutton', category: 'Food', amount: 600.00 },
                    { id: 'e2', name: 'Milk', category: 'Grocery', amount: 69.00 },
                    { id: 'e3', name: 'Michael Store', category: 'Grocery', amount: 394.00 },
                    { id: 'e4', name: 'Mango Items', category: 'Food', amount: 299.00 },
                    { id: 'e5', name: 'Mali Petrol', category: 'Transport', amount: 100.00 },
                    { id: 'e6', name: 'Kothavara', category: 'Grocery', amount: 18.00 },
                    { id: 'e7', name: 'Wach', category: 'Other', amount: 40.00 },
                    { id: 'e8', name: 'Oosi', category: 'Other', amount: 15.00 },
                    { id: 'e9', name: 'Malli Items', category: 'Grocery', amount: 300.00 },
                    { id: 'e10', name: 'Medical', category: 'Medical', amount: 200.00 },
                    { id: 'e11', name: 'Scissor', category: 'Household', amount: 50.00 },
                    { id: 'e12', name: 'Verkadalai Items', category: 'Food', amount: 110.00 },
                    { id: 'e13', name: 'Tea Cash Murali', category: 'Tea', amount: 40.00, note: '2 cups' },
                    { id: 'e14', name: 'Tea Cash', category: 'Tea', amount: 20.00 }
                ],
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            },
            {
                id: '2026-09-14',
                date: '2026-09-14',
                openingBalance: 1001.00,
                received: [
                    { id: 'r3', source: 'Madam', amount: 4000.00 }
                ],
                expenses: [
                    { id: 'e15', name: 'Milk', category: 'Grocery', amount: 46.00 },
                    { id: 'e16', name: 'Pampers', category: 'Personal', amount: 929.00 },
                    { id: 'e17', name: 'Milk', category: 'Grocery', amount: 46.00 },
                    { id: 'e18', name: 'Egg', category: 'Food', amount: 105.00 },
                    { id: 'e19', name: 'Tender Coconut', category: 'Food', amount: 300.00 },
                    { id: 'e20', name: 'Medical', category: 'Medical', amount: 2246.00, note: 'B.Nagar' },
                    { id: 'e21', name: 'Tea Cash Murali', category: 'Tea', amount: 20.00 },
                    { id: 'e22', name: 'Tea Cash', category: 'Tea', amount: 40.00, note: '2 cups' }
                ],
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            }
        ];

        const DEFAULT_SETTINGS = {
            theme: 'light',
            currency: '₹',
            carryForwardBalance: true,
            reportTitle: 'Daily Expense Report',
            greeting: '',
            closingMessage: 'Thank you.',
            showCategories: false,
            showNotes: true,
            quickExpenses: [
                { name: 'Milk', category: 'Grocery' },
                { name: 'Tea', category: 'Tea' },
                { name: 'Petrol', category: 'Transport' },
                { name: 'Medical', category: 'Medical' }
            ]
        };

        const CATEGORIES = ['Food', 'Grocery', 'Medical', 'Transport', 'Household', 'Personal', 'Tea', 'Other'];
        
        const CATEGORY_ICONS = {
            'Food': <Coffee size={16} />,
            'Grocery': <ShoppingCart size={16} />,
            'Medical': <Pill size={16} />,
            'Transport': <Car size={16} />,
            'Household': <HomeIcon size={16} />,
            'Personal': <User size={16} />,
            'Tea': <Coffee size={16} />,
            'Other': <MoreHorizontal size={16} />
        };

        // --- UTILITIES ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        
        const formatCurrency = (amount, currency = '₹') => {
            return `${currency}${parseFloat(amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        };

        const calculateTotals = (report) => {
            if (!report) return { totalReceived: 0, totalExpenses: 0, closingBalance: 0, opening: 0 };
            const totalReceived = (report.received || []).reduce((sum, item) => sum + parseFloat(item.amount || 0), 0);
            const totalExpenses = (report.expenses || []).reduce((sum, item) => sum + parseFloat(item.amount || 0), 0);
            const opening = parseFloat(report.openingBalance || 0);
            const closingBalance = opening + totalReceived - totalExpenses;
            
            return { totalReceived, totalExpenses, closingBalance, opening };
        };

        const generateWhatsAppText = (report, settings) => {
            const { totalReceived, totalExpenses, closingBalance, opening } = calculateTotals(report);
            const dateStr = format(parseISO(report.date), 'dd.MM.yyyy');
            
            let msg = `${settings.reportTitle}\n`;
            msg += `${dateStr}\n\n`;
            
            if (settings.greeting) msg += `${settings.greeting}\n\n`;

            if (opening > 0) {
                msg += `Opening Balance - ${formatCurrency(opening, settings.currency)}\n\n`;
            }

            if (report.received && report.received.length > 0) {
                report.received.forEach(r => {
                    msg += `${r.source} Paid - ${formatCurrency(r.amount, settings.currency)}\n`;
                });
                msg += `\n`;
            }

            msg += `Expenses:\n`;
            if (report.expenses && report.expenses.length > 0) {
                report.expenses.forEach(e => {
                    let noteStr = settings.showNotes && e.note ? ` (${e.note})` : '';
                    let catStr = settings.showCategories && e.category ? ` [${e.category}]` : '';
                    msg += `• ${e.name}${noteStr}${catStr} - ${formatCurrency(e.amount, settings.currency)}\n`;
                });
            } else {
                msg += `• No expenses recorded.\n`;
            }

            msg += `\n`;
            msg += `Total Expenses - ${formatCurrency(totalExpenses, settings.currency)}\n`;
            msg += `Closing Balance - ${formatCurrency(closingBalance, settings.currency)}\n\n`;
            
            if (settings.closingMessage) msg += `${settings.closingMessage}`;
            
            return msg.trim();
        };

        const generatePDF = (report, settings) => {
            const doc = new jsPDF();
            const { totalReceived, totalExpenses, closingBalance, opening } = calculateTotals(report);
            const dateStr = format(parseISO(report.date), 'dd MMMM yyyy');

            // jsPDF standard fonts don't support the ₹ symbol natively. 
            // We map it to 'Rs.' safely for the PDF.
            const safeCurrency = (amount) => {
                const formatted = formatCurrency(amount, settings.currency);
                return formatted.replace('₹', 'Rs. ');
            };

            // Header
            doc.setFontSize(18);
            doc.setTextColor(30, 41, 59); // slate-800
            doc.text(settings.reportTitle.toUpperCase(), 14, 22);
            
            doc.setFontSize(11);
            doc.setTextColor(100, 116, 139); // slate-500
            doc.text(`Date: ${dateStr}`, 14, 30);

            let currentY = 40;

            // Summary Cards (simulated with rects)
            doc.setFillColor(248, 250, 252);
            doc.setDrawColor(226, 232, 240);
            
            const cardWidth = 85;
            const cardHeight = 25;
            
            // Available Card
            doc.roundedRect(14, currentY, cardWidth, cardHeight, 3, 3, 'FD');
            doc.setFontSize(10);
            doc.text('Total Available', 18, currentY + 10);
            doc.setFontSize(14);
            doc.setTextColor(16, 185, 129); // success
            doc.text(safeCurrency(opening + totalReceived), 18, currentY + 20);

            // Expenses Card
            doc.roundedRect(110, currentY, cardWidth, cardHeight, 3, 3, 'FD');
            doc.setFontSize(10);
            doc.setTextColor(100, 116, 139);
            doc.text('Total Expenses', 114, currentY + 10);
            doc.setFontSize(14);
            doc.setTextColor(239, 68, 68); // danger
            doc.text(safeCurrency(totalExpenses), 114, currentY + 20);

            currentY += 35;

            // Balance Card (Full width)
            doc.roundedRect(14, currentY, 181, cardHeight, 3, 3, 'FD');
            doc.setFontSize(11);
            doc.setTextColor(30, 41, 59);
            doc.text('Closing Balance', 18, currentY + 10);
            doc.setFontSize(16);
            doc.setTextColor(79, 70, 229); // primary
            doc.text(safeCurrency(closingBalance), 18, currentY + 20);

            currentY += 35;

            // Received Table
            if (report.received && report.received.length > 0 || opening > 0) {
                const receivedBody = [];
                if (opening > 0) receivedBody.push(['Opening Balance', safeCurrency(opening)]);
                report.received.forEach(r => receivedBody.push([`${r.source} Paid`, safeCurrency(r.amount)]));

                autoTable(doc, {
                    startY: currentY,
                    head: [['Money Received', 'Amount']],
                    body: receivedBody,
                    theme: 'grid',
                    headStyles: { fillColor: [241, 245, 249], textColor: [30, 41, 59], fontStyle: 'bold' },
                    columnStyles: { 1: { halign: 'right', fontStyle: 'bold' } },
                    margin: { left: 14, right: 14 }
                });
                currentY = doc.lastAutoTable.finalY + 10;
            }

            // Expenses Table
            if (report.expenses && report.expenses.length > 0) {
                const expensesBody = report.expenses.map((e, i) => [
                    i + 1,
                    e.name + (e.note ? `\n(${e.note})` : ''),
                    e.category || '-',
                    safeCurrency(e.amount)
                ]);

                autoTable(doc, {
                    startY: currentY,
                    head: [['#', 'Expense', 'Category', 'Amount']],
                    body: expensesBody,
                    theme: 'striped',
                    headStyles: { fillColor: [79, 70, 229], textColor: [255, 255, 255] },
                    columnStyles: { 
                        0: { cellWidth: 15 },
                        3: { halign: 'right', fontStyle: 'bold' } 
                    },
                    margin: { left: 14, right: 14 }
                });
                currentY = doc.lastAutoTable.finalY + 10;
            }

            // Footer
            const pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(9);
                doc.setTextColor(148, 163, 184);
                doc.text(`Generated by Daily Expenses App`, 14, doc.internal.pageSize.height - 10);
                doc.text(`Page ${i} of ${pageCount}`, doc.internal.pageSize.width - 25, doc.internal.pageSize.height - 10);
            }

            doc.save(`Expense_Report_${dateStr.replace(/ /g, '_')}.pdf`);
        };

        // --- HOOKS ---
        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error(error);
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error(error);
                }
            };
            return [storedValue, setValue];
        };

        // --- COMPONENTS ---
        const ToastContext = React.createContext();

        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);

            const addToast = useCallback((message, type = 'success') => {
                const id = generateId();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 3000);
            }, []);

            return (
                <ToastContext.Provider value={addToast}>
                    {children}
                    <div className="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`slide-in-right flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-white pointer-events-auto
                                ${toast.type === 'success' ? 'bg-success' : toast.type === 'error' ? 'bg-danger' : 'bg-slate-800'}`}>
                                {toast.type === 'success' && <Check size={18} />}
                                <span className="font-medium text-sm">{toast.message}</span>
                            </div>
                        ))}
                    </div>
                </ToastContext.Provider>
            );
        };

        const useToast = () => React.useContext(ToastContext);

        const Card = ({ children, className = '', onClick }) => (
            <div onClick={onClick} className={`bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-4 ${onClick ? 'cursor-pointer hover:shadow-md transition-shadow' : ''} ${className}`}>
                {children}
            </div>
        );

        const Button = ({ children, variant = 'primary', className = '', icon: Icon, ...props }) => {
            const baseStyle = "flex items-center justify-center gap-2 px-4 py-2 rounded-lg font-medium transition-all active:scale-95";
            const variants = {
                primary: "bg-primary text-white hover:bg-indigo-700 shadow-sm",
                secondary: "bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700",
                danger: "bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/40",
                ghost: "text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800",
                outline: "border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800"
            };
            return (
                <button className={`${baseStyle} ${variants[variant]} ${className}`} {...props}>
                    {Icon && <Icon size={18} />}
                    {children}
                </button>
            );
        };

        const Input = ({ label, icon: Icon, className = '', ...props }) => (
            <div className={`flex flex-col gap-1.5 ${className}`}>
                {label && <label className="text-sm font-medium text-slate-700 dark:text-slate-300">{label}</label>}
                <div className="relative">
                    {Icon && <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon size={18} /></div>}
                    <input 
                        className={`w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-4 py-2.5 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all ${Icon ? 'pl-10' : ''}`}
                        {...props}
                    />
                </div>
            </div>
        );

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center fade-in">
                    <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full md:w-full md:max-w-md bg-surface-light dark:bg-surface-dark rounded-t-2xl md:rounded-2xl shadow-xl slide-up max-h-[90vh] flex flex-col m-0 md:m-4">
                        <div className="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-800">
                            <h3 className="font-semibold text-lg">{title}</h3>
                            <button onClick={onClose} className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                                <X size={20} />
                            </button>
                        </div>
                        <div className="p-4 overflow-y-auto no-scrollbar">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const DashboardView = ({ reports, onNavigate, settings, showInstallButton, onInstall }) => {
            const todayStr = format(new Date(), 'yyyy-MM-dd');
            const todayReport = reports.find(r => r.date === todayStr);
            const { totalReceived, totalExpenses, closingBalance } = calculateTotals(todayReport);

            return (
                <div className="p-4 md:p-8 max-w-5xl mx-auto pb-24 md:pb-8 slide-up">
                    <header className="mb-8 flex justify-between items-end gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Dashboard</h1>
                            <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">{format(new Date(), 'EEEE, dd MMMM yyyy')}</p>
                        </div>
                        <div className="flex items-center gap-2">
                            {/* Install App Icon Button */}
                            {showInstallButton && (
                                <button 
                                    onClick={onInstall} 
                                    className="p-2.5 md:px-4 md:py-2 bg-indigo-50 dark:bg-indigo-900/30 text-primary hover:bg-indigo-100 dark:hover:bg-indigo-900/50 rounded-xl md:rounded-lg flex items-center gap-2 transition-all shadow-sm border border-indigo-100 dark:border-indigo-500/30"
                                    title="Add to Home Screen (Install App)"
                                >
                                    <Download size={20} />
                                    <span className="hidden md:inline font-medium">Install App</span>
                                </button>
                            )}
                            <Button onClick={() => onNavigate('new')} icon={PlusCircle} className="hidden md:flex">
                                New Report
                            </Button>
                        </div>
                    </header>

                    {/* Add to Home Screen Banner */}
                    {showInstallButton && (
                        <div className="mb-8 bg-gradient-to-r from-primary to-indigo-600 rounded-2xl p-5 text-white flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-lg slide-up relative overflow-hidden">
                            {/* Decorative background pattern */}
                            <div className="absolute inset-0 opacity-[0.1] pointer-events-none" style={{backgroundImage: 'url("data:image/svg+xml,%3Csvg width=\'20\' height=\'20\' viewBox=\'0 0 20 20\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'1\' fill-rule=\'evenodd\'%3E%3Ccircle cx=\'3\' cy=\'3\' r=\'3\'/%3E%3Cg/%3E%3C/svg%3E")'}}></div>
                            
                            <div className="flex items-center gap-4 relative z-10">
                                <div className="bg-white/20 p-3 rounded-xl backdrop-blur-sm shadow-inner text-white">
                                    <Download size={24} />
                                </div>
                                <div>
                                    <h3 className="font-bold text-lg">Add to Home Screen</h3>
                                    <p className="text-indigo-100 text-sm mt-0.5">Install the app for offline use and quick access from your device.</p>
                                </div>
                            </div>
