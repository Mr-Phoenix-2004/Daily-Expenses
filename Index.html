                                Install App
                            </Button>
                        </div>
                    )}

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <Card className="bg-gradient-to-br from-indigo-500 to-primary text-white border-none shadow-indigo-200 dark:shadow-none">
                            <div className="text-indigo-100 text-sm font-medium mb-1">Total Available</div>
                            <div className="text-2xl font-bold">{formatCurrency(todayReport?.openingBalance + totalReceived || 0, settings.currency)}</div>
                        </Card>
                        <Card>
                            <div className="text-slate-500 dark:text-slate-400 text-sm font-medium mb-1 flex items-center gap-1"><ArrowRightLeft size={14}/> Received</div>
                            <div className="text-2xl font-bold text-slate-900 dark:text-white">{formatCurrency(totalReceived, settings.currency)}</div>
                        </Card>
                        <Card>
                            <div className="text-slate-500 dark:text-slate-400 text-sm font-medium mb-1 flex items-center gap-1"><ShoppingCart size={14}/> Spent</div>
                            <div className="text-2xl font-bold text-danger">{formatCurrency(totalExpenses, settings.currency)}</div>
                        </Card>
                        <Card>
                            <div className="text-slate-500 dark:text-slate-400 text-sm font-medium mb-1">Closing Balance</div>
                            <div className="text-2xl font-bold text-primary">{formatCurrency(closingBalance, settings.currency)}</div>
                        </Card>
                    </div>

                    <div className="flex items-center justify-between mb-4">
                        <h2 className="text-lg font-bold">Today's Report</h2>
                        {todayReport && (
                            <Button variant="ghost" onClick={() => onNavigate('new')} className="text-sm">
                                Edit Today
                            </Button>
                        )}
                    </div>

                    {todayReport ? (
                        <div className="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
                            {todayReport.expenses.length > 0 ? (
                                <div className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {todayReport.expenses.map(exp => (
                                        <div key={exp.id} className="p-4 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                            <div className="flex items-center gap-3">
                                                <div className="p-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-slate-500 dark:text-slate-400">
                                                    {CATEGORY_ICONS[exp.category] || <MoreHorizontal size={18}/>}
                                                </div>
                                                <div>
                                                    <div className="font-medium">{exp.name}</div>
                                                    <div className="text-xs text-slate-500">{exp.category} {exp.note && `• ${exp.note}`}</div>
                                                </div>
                                            </div>
                                            <div className="font-semibold">{formatCurrency(exp.amount, settings.currency)}</div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="p-8 text-center text-slate-500">
                                    <FileText size={48} className="mx-auto mb-3 opacity-20" />
                                    <p>No expenses added yet today.</p>
                                </div>
                            )}
                        </div>
                    ) : (
                        <Card className="text-center p-8 border-dashed">
                            <div className="mx-auto w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mb-4 text-primary">
                                <Plus size={32} />
                            </div>
                            <h3 className="text-lg font-medium mb-2">No report for today</h3>
                            <p className="text-slate-500 mb-6 max-w-sm mx-auto text-sm">Start recording your expenses to keep track of your daily budget.</p>
                            <Button onClick={() => onNavigate('new')} className="mx-auto">Create Today's Report</Button>
                        </Card>
                    )}
                </div>
            );
        };

        const DailyReportView = ({ reports, setReports, settings, editingId, onNavigate }) => {
            const toast = useToast();
            const [report, setReport] = useState(() => {
                if (editingId) {
                    const existing = reports.find(r => r.id === editingId);
                    if (existing) return JSON.parse(JSON.stringify(existing)); // Deep copy
                }
                
                const todayStr = format(new Date(), 'yyyy-MM-dd');
                const existingToday = reports.find(r => r.date === todayStr);
                if (existingToday) return JSON.parse(JSON.stringify(existingToday));

                // Auto carry forward logic
                let initialOpening = 0;
                if (settings.carryForwardBalance && reports.length > 0) {
                    const sortedReports = [...reports].sort((a, b) => new Date(b.date) - new Date(a.date));
                    const latestReport = sortedReports[0];
                    if (latestReport.date !== todayStr) { // Don't carry forward if we somehow have a future report
                        const prevTotals = calculateTotals(latestReport);
                        initialOpening = prevTotals.closingBalance;
                    }
                }

                return {
                    id: todayStr, // using date as ID for simplicity if one per day
                    date: todayStr,
                    openingBalance: initialOpening,
                    received: [],
                    expenses: []
                };
            });

            const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
            const [isIncomeModalOpen, setIsIncomeModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);

            // Form States
            const [expForm, setExpForm] = useState({ name: '', amount: '', category: 'Grocery', note: '' });
            const [incForm, setIncForm] = useState({ source: '', amount: '' });

            const { totalReceived, totalExpenses, closingBalance, opening } = calculateTotals(report);

            // Save automatically on change
            useEffect(() => {
                const newReports = [...reports];
                const index = newReports.findIndex(r => r.id === report.id);
                
                const updatedReport = { ...report, updatedAt: new Date().toISOString() };
                
                if (index >= 0) {
                    newReports[index] = updatedReport;
                } else {
                    newReports.push(updatedReport);
                }
                // Sort by date descending
                newReports.sort((a, b) => new Date(b.date) - new Date(a.date));
                setReports(newReports);
            }, [report]);

            const handleAddExpense = (e) => {
                if (e) e.preventDefault();
                if (!expForm.name || !expForm.amount || isNaN(expForm.amount) || expForm.amount <= 0) {
                    toast('Please enter valid name and amount', 'error');
                    return;
                }

                const newExp = {
                    id: editingItem ? editingItem.id : generateId(),
                    name: expForm.name,
                    amount: parseFloat(expForm.amount),
                    category: expForm.category,
                    note: expForm.note
                };

                if (editingItem) {
                    setReport(prev => ({
                        ...prev,
                        expenses: prev.expenses.map(ex => ex.id === newExp.id ? newExp : ex)
                    }));
                    toast('Expense updated');
                } else {
                    setReport(prev => ({
                        ...prev,
                        expenses: [newExp, ...prev.expenses]
                    }));
                    toast('Expense added');
                }
                
                setIsExpenseModalOpen(false);
                setExpForm({ name: '', amount: '', category: 'Grocery', note: '' });
                setEditingItem(null);
            };

            const handleAddIncome = (e) => {
                e.preventDefault();
                if (!incForm.source || !incForm.amount || isNaN(incForm.amount) || incForm.amount <= 0) {
                    toast('Please enter valid source and amount', 'error');
                    return;
                }

                const newInc = {
                    id: editingItem ? editingItem.id : generateId(),
                    source: incForm.source,
                    amount: parseFloat(incForm.amount)
                };

                if (editingItem) {
                    setReport(prev => ({
                        ...prev,
                        received: prev.received.map(r => r.id === newInc.id ? newInc : r)
                    }));
                    toast('Received amount updated');
                } else {
                    setReport(prev => ({
                        ...prev,
                        received: [...prev.received, newInc]
                    }));
                    toast('Received amount added');
                }

                setIsIncomeModalOpen(false);
                setIncForm({ source: '', amount: '' });
                setEditingItem(null);
            };

            const deleteItem = (type, id) => {
                if (confirm('Are you sure you want to delete this?')) {
                    if (type === 'expense') {
                        setReport(prev => ({ ...prev, expenses: prev.expenses.filter(e => e.id !== id) }));
                    } else {
                        setReport(prev => ({ ...prev, received: prev.received.filter(r => r.id !== id) }));
                    }
                    toast('Item deleted');
                }
            };

            const handleShare = async () => {
                const text = generateWhatsAppText(report, settings);
                
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: `Expense Report - ${format(parseISO(report.date), 'dd.MM.yyyy')}`,
                            text: text,
                        });
                        toast('Shared successfully');
                    } catch (err) {
                        console.log('Share cancelled or failed', err);
                    }
                } else {
                    copyToClipboard(text);
                }
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text).then(() => {
                    toast('Copied to clipboard!');
                }).catch(err => {
                    // Fallback
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        toast('Copied to clipboard!');
                    } catch (err) {
                        toast('Failed to copy', 'error');
                    }
                    document.body.removeChild(textArea);
                });
            };

            const handlePdf = () => {
                try {
                    generatePDF(report, settings);
                    toast('PDF Generated successfully');
                } catch (e) {
                    toast('Failed to generate PDF', 'error');
                    console.error(e);
                }
            };

            const handleDateChange = (e) => {
                const newDate = e.target.value;
                // If a report exists for this date, load it, otherwise change ID and date
                const existing = reports.find(r => r.date === newDate);
                if (existing) {
                    if(confirm("A report already exists for this date. Load it?")) {
                        setReport(JSON.parse(JSON.stringify(existing)));
                    } else {
                        e.target.value = report.date; // revert
                    }
                } else {
                    setReport(prev => ({ ...prev, id: newDate, date: newDate }));
                }
            };

            const openEditIncome = (inc) => {
                setEditingItem(inc);
                setIncForm({ source: inc.source, amount: inc.amount.toString() });
                setIsIncomeModalOpen(true);
            };

            const openEditExpense = (exp) => {
                setEditingItem(exp);
                setExpForm({ name: exp.name, amount: exp.amount.toString(), category: exp.category, note: exp.note || '' });
                setIsExpenseModalOpen(true);
            };

            return (
                <div className="p-4 md:p-8 max-w-4xl mx-auto pb-32 md:pb-8 slide-up">
                    <header className="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <input 
                                type="date" 
                                value={report.date}
                                onChange={handleDateChange}
                                className="bg-transparent text-xl font-bold text-slate-900 dark:text-white outline-none border-b-2 border-transparent focus:border-primary cursor-pointer"
                            />
                        </div>
                        <div className="flex gap-2">
                            <Button variant="outline" onClick={handleShare} icon={Share2} className="flex-1 md:flex-none">Share</Button>
                            <Button variant="outline" onClick={() => copyToClipboard(generateWhatsAppText(report, settings))} icon={Copy} className="flex-1 md:flex-none">Copy</Button>
                            <Button variant="outline" onClick={handlePdf} icon={FileText} className="flex-1 md:flex-none hidden md:flex">PDF</Button>
                        </div>
                    </header>

                    <div className="grid md:grid-cols-3 gap-6 mb-8">
                        {/* Summary Column */}
                        <div className="space-y-4 md:col-span-1">
                            <Card className="bg-slate-50 dark:bg-slate-800/50">
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-sm font-medium text-slate-500">Opening Balance</label>
                                        <div className="relative mt-1">
                                            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">{settings.currency}</span>
                                            <input 
                                                type="number" 
                                                value={report.openingBalance || ''}
                                                onChange={(e) => setReport(prev => ({ ...prev, openingBalance: parseFloat(e.target.value) || 0 }))}
                                                className="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg pl-8 pr-4 py-2 font-medium focus:ring-2 focus:ring-primary outline-none transition-all"
                                            />
                                        </div>
                                    </div>
                                    
                                    <div className="flex justify-between items-center border-t border-slate-200 dark:border-slate-700 pt-3">
                                        <span className="text-slate-600 dark:text-slate-400">Total Received</span>
                                        <span className="font-semibold">{formatCurrency(totalReceived, settings.currency)}</span>
                                    </div>
                                    <div className="flex justify-between items-center text-danger">
                                        <span>Total Expenses</span>
                                        <span className="font-semibold">-{formatCurrency(totalExpenses, settings.currency)}</span>
                                    </div>
                                    <div className="flex justify-between items-center border-t border-slate-200 dark:border-slate-700 pt-3 text-lg">
                                        <span className="font-bold">Closing Balance</span>
                                        <span className="font-bold text-primary">{formatCurrency(closingBalance, settings.currency)}</span>
                                    </div>
                                </div>
                            </Card>

                            <Card>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-semibold text-slate-700 dark:text-slate-300">Money Received</h3>
                                    <button onClick={() => { setEditingItem(null); setIncForm({source:'', amount:''}); setIsIncomeModalOpen(true); }} className="text-primary hover:bg-indigo-50 dark:hover:bg-indigo-900/30 p-1.5 rounded-full transition-colors">
                                        <Plus size={20} />
                                    </button>
                                </div>
                                {report.received.length === 0 ? (
                                    <p className="text-sm text-slate-400 italic">No money received added.</p>
                                ) : (
                                    <div className="space-y-3">
                                        {report.received.map(r => (
                                            <div key={r.id} className="flex justify-between items-center group">
                                                <span className="text-sm font-medium">{r.source}</span>
                                                <div className="flex items-center gap-3">
                                                    <span className="font-semibold text-success">{formatCurrency(r.amount, settings.currency)}</span>
                                                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                        <button onClick={() => openEditIncome(r)} className="text-slate-400 hover:text-primary"><Edit2 size={14}/></button>
                                                        <button onClick={() => deleteItem('income', r.id)} className="text-slate-400 hover:text-danger"><Trash2 size={14}/></button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </Card>
                            
                            {/* Quick Expenses */}
                            {settings.quickExpenses.length > 0 && (
                                <Card>
                                    <h3 className="font-semibold text-slate-700 dark:text-slate-300 mb-3 text-sm">Quick Add</h3>
                                    <div className="flex flex-wrap gap-2">
                                        {settings.quickExpenses.map((qe, idx) => (
                                            <button 
                                                key={idx}
                                                onClick={() => {
                                                    setEditingItem(null);
                                                    setExpForm({ name: qe.name, amount: '', category: qe.category, note: '' });
                                                    setIsExpenseModalOpen(true);
                                                }}
                                                className="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-sm font-medium px-3 py-1.5 rounded-full transition-colors border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 flex items-center gap-1"
                                            >
                                                <Plus size={12}/> {qe.name}
                                            </button>
                                        ))}
                                    </div>
                                </Card>
                            )}
                        </div>

                        {/* Expenses Column */}
                        <div className="md:col-span-2 space-y-4">
                            <div className="flex justify-between items-center">
                                <h2 className="text-lg font-bold">Expenses ({report.expenses.length})</h2>
                                <Button onClick={() => { setEditingItem(null); setExpForm({name:'', amount:'', category:'Grocery', note:''}); setIsExpenseModalOpen(true); }} icon={Plus} className="shadow-md">Add Expense</Button>
                            </div>

                            {report.expenses.length === 0 ? (
                                <div className="bg-white dark:bg-slate-900 border border-dashed border-slate-300 dark:border-slate-700 rounded-xl p-10 text-center">
                                    <ShoppingCart size={48} className="mx-auto text-slate-300 dark:text-slate-700 mb-4" />
                                    <p className="text-slate-500 font-medium">No expenses recorded today.</p>
                                    <p className="text-sm text-slate-400 mt-1">Tap 'Add Expense' to get started.</p>
                                </div>
                            ) : (
                                <div className="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
                                    {/* Desktop Table Header */}
                                    <div className="hidden md:grid grid-cols-12 gap-4 p-4 bg-slate-50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-800 font-medium text-sm text-slate-500">
                                        <div className="col-span-4">Expense</div>
                                        <div className="col-span-3">Category</div>
                                        <div className="col-span-2">Amount</div>
                                        <div className="col-span-3 text-right">Actions</div>
                                    </div>
                                    
                                    <div className="divide-y divide-slate-100 dark:divide-slate-800">
                                        {report.expenses.map(exp => (
                                            <div key={exp.id} className="p-4 flex flex-col md:grid md:grid-cols-12 md:gap-4 md:items-center hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors group">
                                                
                                                {/* Mobile View */}
                                                <div className="md:hidden flex justify-between items-start mb-2">
                                                    <div className="flex items-start gap-3">
                                                        <div className="p-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-slate-500 mt-1">
                                                            {CATEGORY_ICONS[exp.category] || <MoreHorizontal size={16}/>}
                                                        </div>
                                                        <div>
                                                            <div className="font-semibold text-slate-900 dark:text-white">{exp.name}</div>
                                                            <div className="text-xs text-slate-500 mt-0.5">{exp.category} {exp.note && `• ${exp.note}`}</div>
                                                        </div>
                                                    </div>
                                                    <div className="font-bold text-lg">{formatCurrency(exp.amount, settings.currency)}</div>
                                                </div>
                                                <div className="md:hidden flex justify-end gap-2 border-t border-slate-100 dark:border-slate-800 pt-2 mt-2">
                                                    <Button variant="ghost" className="px-2 py-1 text-sm h-auto" onClick={() => openEditExpense(exp)}><Edit2 size={14} className="mr-1"/> Edit</Button>
                                                    <Button variant="danger" className="px-2 py-1 text-sm h-auto bg-transparent border-0" onClick={() => deleteItem('expense', exp.id)}><Trash2 size={14} className="mr-1"/> Delete</Button>
                                                </div>

                                                {/* Desktop View */}
                                                <div className="hidden md:flex col-span-4 flex-col">
                                                    <span className="font-medium text-slate-900 dark:text-white">{exp.name}</span>
                                                    {exp.note && <span className="text-xs text-slate-500">{exp.note}</span>}
                                                </div>
                                                <div className="hidden md:flex col-span-3 items-center gap-2 text-sm text-slate-600 dark:text-slate-400">
                                                    {CATEGORY_ICONS[exp.category]} {exp.category}
                                                </div>
                                                <div className="hidden md:flex col-span-2 font-semibold">
                                                    {formatCurrency(exp.amount, settings.currency)}
                                                </div>
                                                <div className="hidden md:flex col-span-3 justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <button onClick={() => openEditExpense(exp)} className="p-2 text-slate-400 hover:text-primary bg-slate-100 dark:bg-slate-800 rounded-lg"><Edit2 size={16}/></button>
                                                    <button onClick={() => deleteItem('expense', exp.id)} className="p-2 text-slate-400 hover:text-danger bg-slate-100 dark:bg-slate-800 rounded-lg"><Trash2 size={16}/></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Floating Add Button for Mobile */}
                    <div className="md:hidden fixed bottom-20 right-4 z-40">
                        <button onClick={() => { setEditingItem(null); setExpForm({name:'', amount:'', category:'Grocery', note:''}); setIsExpenseModalOpen(true); }} className="bg-primary text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center hover:bg-indigo-700 active:scale-95 transition-all">
                            <Plus size={28} />
                        </button>
                    </div>

                    {/* Report Preview */}
                    <div className="mt-8 pt-8 border-t border-slate-200 dark:border-slate-800">
                        <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                            <FileText size={16}/> Message Preview
                        </h3>
                        
                        <div className="relative max-w-sm mx-auto">
                            {/* Chat background simulation */}
                            <div className="absolute inset-0 bg-[#efeae2] dark:bg-[#0b141a] rounded-2xl overflow-hidden shadow-inner border border-slate-200 dark:border-slate-700">
                                {/* Doodles pattern */}
                                <div className="absolute inset-0 opacity-[0.06] dark:opacity-[0.03] pointer-events-none mix-blend-multiply dark:mix-blend-screen" style={{backgroundImage: 'url("data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M54.627 0l.83.83-53.797 53.798-.83-.83L54.627 0zM29.5 0l29.5 29.5-29.5 29.5L0 29.5 29.5 0zm0 3.328L3.328 29.5 29.5 55.672 55.672 29.5 29.5 3.328zM31 15a1 1 0 110 2h-4a1 1 0 110-2h4zm0 6a1 1 0 110 2h-4a1 1 0 110-2h4zm0 6a1 1 0 110 2h-4a1 1 0 110-2h4zm0 6a1 1 0 110 2h-4a1 1 0 110-2h4zm0 6a1 1 0 110 2h-4a1 1 0 110-2h4zm0 6a1 1 0 110 2h-4a1 1 0 110-2h4z\' fill=\'%23000000\' fill-rule=\'evenodd\'/%3E%3C/svg%3E")'}}></div>
                            </div>
                            
                            {/* Message Bubble */}
                            <div className="relative p-4 pb-6">
                                <div className="bg-white dark:bg-[#202c33] rounded-2xl rounded-tl-sm p-4 shadow-[0_1px_2px_rgba(0,0,0,0.1)] dark:shadow-none text-[15px] leading-relaxed whitespace-pre-wrap font-sans text-[#111b21] dark:text-[#e9edef] w-[95%]">
                                    {/* Tail */}
                                    <div className="absolute top-0 left-[-8px] w-0 h-0 border-[10px] border-transparent border-t-white dark:border-t-[#202c33] border-r-white dark:border-r-[#202c33]"></div>
                                    
                                    {/* Content rendered with WhatsApp formatting simulated (bolding *) */}
                                    {generateWhatsAppText(report, settings).split('\n').map((line, i) => {
                                        // Simple regex to bold text between asterisks (kept for user custom titles)
                                        const parts = line.split(/(\*[^*]+\*)/g);
                                        return (
                                            <React.Fragment key={i}>
                                                {parts.map((part, j) => {
                                                    if (part.startsWith('*') && part.endsWith('*')) {
                                                        return <strong key={j} className="font-bold">{part.slice(1, -1)}</strong>;
                                                    }
                                                    return part;
                                                })}
                                                {i < generateWhatsAppText(report, settings).split('\n').length - 1 && <br />}
                                            </React.Fragment>
                                        );
                                    })}
                                    
                                    {/* Mock time at bottom right */}
                                    <div className="float-right mt-1 ml-3 text-[11px] text-[#667781] dark:text-[#8696a0] flex items-center gap-1">
                                        {format(new Date(), 'HH:mm')}
                                    </div>
                                    <div className="clear-both"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Modals */}
                    <Modal isOpen={isIncomeModalOpen} onClose={() => setIsIncomeModalOpen(false)} title={editingItem ? "Edit Received" : "Add Money Received"}>
                        <form onSubmit={handleAddIncome} className="space-y-4">
                            <Input 
                                label="Received From (Source)" 
                                placeholder="e.g. Sir, Madam, Bank" 
                                value={incForm.source}
                                onChange={e => setIncForm(prev => ({...prev, source: e.target.value}))}
                                autoFocus
                                required
                            />
                            <Input 
                                label="Amount" 
                                type="number" 
                                step="any"
                                placeholder="0.00" 
                                icon={() => <span className="text-slate-500 font-medium">{settings.currency}</span>}
                                value={incForm.amount}
                                onChange={e => setIncForm(prev => ({...prev, amount: e.target.value}))}
                                required
                            />
                            <Button type="submit" className="w-full mt-2 text-lg py-3">{editingItem ? 'Update' : 'Add'} Amount</Button>
                        </form>
                    </Modal>

                    <Modal isOpen={isExpenseModalOpen} onClose={() => setIsExpenseModalOpen(false)} title={editingItem ? "Edit Expense" : "Add Expense"}>
                        <form onSubmit={handleAddExpense} className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <Input 
                                    label="Expense Name" 
                                    placeholder="e.g. Milk, Petrol" 
                                    value={expForm.name}
                                    onChange={e => setExpForm(prev => ({...prev, name: e.target.value}))}
                                    className="col-span-2"
                                    autoFocus
                                    required
                                />
                                <Input 
                                    label="Amount" 
                                    type="number" 
                                    step="any"
                                    placeholder="0.00" 
                                    icon={() => <span className="text-slate-500 font-medium">{settings.currency}</span>}
                                    value={expForm.amount}
                                    onChange={e => setExpForm(prev => ({...prev, amount: e.target.value}))}
                                    className="col-span-2"
                                    required
                                />
                            </div>
                            
                            <div>
                                <label className="text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5 block">Category</label>
                                <div className="grid grid-cols-4 gap-2">
                                    {CATEGORIES.map(cat => (
                                        <button
                                            key={cat}
                                            type="button"
                                            onClick={() => setExpForm(prev => ({...prev, category: cat}))}
                                            className={`flex flex-col items-center justify-center p-2 rounded-lg border text-xs gap-1 transition-all
                                                ${expForm.category === cat 
                                                    ? 'bg-primary/10 border-primary text-primary dark:bg-primary/20' 
                                                    : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-500 hover:bg-slate-50'}`}
                                        >
                                            {CATEGORY_ICONS[cat]}
                                            <span className="truncate w-full text-center">{cat}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <Input 
                                label="Note (Optional)" 
                                placeholder="Additional details..." 
                                value={expForm.note}
                                onChange={e => setExpForm(prev => ({...prev, note: e.target.value}))}
                            />
                            <Button type="submit" className="w-full mt-4 text-lg py-3">{editingItem ? 'Update' : 'Add'} Expense</Button>
                        </form>
                    </Modal>
                </div>
            );
        };

        const HistoryView = ({ reports, setReports, onNavigate, settings }) => {
            const toast = useToast();
            const [searchTerm, setSearchTerm] = useState('');

            const filteredReports = reports.filter(r => 
                r.date.includes(searchTerm) || 
                r.expenses.some(e => e.name.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            const handleDuplicate = (report) => {
                const newDate = format(new Date(), 'yyyy-MM-dd');
                if (reports.some(r => r.date === newDate)) {
                    if(!confirm("A report for today already exists. Do you want to overwrite it with this copy?")) return;
                }
                
                const duplicated = JSON.parse(JSON.stringify(report));
                duplicated.id = newDate;
                duplicated.date = newDate;
                duplicated.createdAt = new Date().toISOString();
                duplicated.updatedAt = new Date().toISOString();
                
                // Allow user to decide if they want to clear amounts in a real app, here we copy exactly as requested "copy structure while allowing to modify"
                
                setReports(prev => {
                    const filtered = prev.filter(r => r.date !== newDate);
                    return [duplicated, ...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));
                });
                
                toast('Report duplicated to today');
                onNavigate('new', duplicated.id);
            };

            const handleDelete = (id) => {
                if(confirm("Are you sure you want to delete this entire report? This cannot be undone.")) {
                    setReports(prev => prev.filter(r => r.id !== id));
                    toast('Report deleted');
                }
            };

            return (
                <div className="p-4 md:p-8 max-w-4xl mx-auto pb-24 md:pb-8 slide-up">
                    <header className="mb-6">
                        <h1 className="text-2xl font-bold mb-4">History</h1>
                        <Input 
                            placeholder="Search expenses or dates..." 
                            value={searchTerm}
                            onChange={e => setSearchTerm(e.target.value)}
                            className="max-w-md"
                        />
                    </header>

                    {filteredReports.length === 0 ? (
                        <div className="text-center p-12 bg-white dark:bg-slate-900 rounded-xl border border-dashed border-slate-300">
                            <HistoryIcon size={48} className="mx-auto text-slate-300 mb-4" />
                            <p className="text-slate-500 font-medium">No reports found.</p>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {filteredReports.map(report => {
                                const { totalReceived, totalExpenses, closingBalance, opening } = calculateTotals(report);
                                const dateObj = parseISO(report.date);
                                
                                return (
                                    <Card key={report.id} className="group hover:border-primary/50 transition-colors">
                                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                            <div className="flex items-center gap-4">
                                                <div className="bg-primary/10 text-primary rounded-lg p-3 text-center min-w-[70px]">
                                                    <div className="text-sm font-bold uppercase">{format(dateObj, 'MMM')}</div>
                                                    <div className="text-2xl font-black leading-none">{format(dateObj, 'dd')}</div>
                                                    <div className="text-xs font-medium mt-1">{format(dateObj, 'yyyy')}</div>
                                                </div>
                                                <div>
                                                    <div className="flex flex-wrap gap-x-4 gap-y-1 text-sm mb-2">
                                                        <span className="text-slate-500">Opening: <span className="font-semibold text-slate-700 dark:text-slate-300">{formatCurrency(opening, settings.currency)}</span></span>
                                                        <span className="text-slate-500">Received: <span className="font-semibold text-success">{formatCurrency(totalReceived, settings.currency)}</span></span>
                                                        <span className="text-slate-500">Spent: <span className="font-semibold text-danger">{formatCurrency(totalExpenses, settings.currency)}</span></span>
                                                    </div>
                                                    <div className="text-lg font-bold">
                                                        Balance: <span className="text-primary">{formatCurrency(closingBalance, settings.currency)}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div className="flex items-center gap-2 border-t md:border-t-0 pt-3 md:pt-0 border-slate-100 dark:border-slate-800">
                                                <Button variant="ghost" className="p-2" onClick={() => onNavigate('new', report.id)} title="Edit"><Edit2 size={18}/></Button>
                                                <Button variant="ghost" className="p-2" onClick={() => handleDuplicate(report)} title="Duplicate to Today"><Copy size={18}/></Button>
                                                <Button variant="ghost" className="p-2" onClick={() => {
                                                    copyToClipboard(generateWhatsAppText(report, settings));
                                                    toast('Copied to clipboard');
                                                }} title="Copy WhatsApp"><Share2 size={18}/></Button>
                                                <Button variant="ghost" className="p-2 text-danger hover:bg-red-50" onClick={() => handleDelete(report.id)} title="Delete"><Trash2 size={18}/></Button>
                                            </div>
                                        </div>
                                    </Card>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const SettingsView = ({ settings, setSettings, setReports }) => {
            const toast = useToast();
            const fileInputRef = useRef(null);

            const toggleTheme = () => {
                const newTheme = settings.theme === 'light' ? 'dark' : 'light';
                setSettings(prev => ({ ...prev, theme: newTheme }));
                if (newTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            };

            const handleExport = () => {
                const dataStr = localStorage.getItem('expenses_reports');
                if (!dataStr) return toast('No data to export', 'error');
                
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                const exportFileDefaultName = `expenses_backup_${format(new Date(), 'yyyy-MM-dd')}.json`;

                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
                toast('Data exported successfully');
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsedData = JSON.parse(event.target.result);
                        if (Array.isArray(parsedData)) {
                            setReports(parsedData);
                            toast('Data imported successfully');
                        } else {
                            toast('Invalid file format', 'error');
                        }
                    } catch (err) {
                        toast('Error parsing file', 'error');
                    }
                };
                reader.readAsText(file);
                // Reset input
                e.target.value = null;
            };

            const handleClearAll = () => {
                if(confirm("Are you absolutely sure you want to delete ALL data? This action cannot be reversed.")) {
                    if(confirm("Please confirm again. DELETE ALL DATA?")) {
                        setReports([]);
                        toast('All data cleared');
                    }
                }
            };

            return (
                <div className="p-4 md:p-8 max-w-3xl mx-auto pb-24 md:pb-8 slide-up">
                    <h1 className="text-2xl font-bold mb-6">Settings</h1>
                    
                    <div className="space-y-6">
                        <Card>
                            <h2 className="text-lg font-semibold mb-4 border-b border-slate-100 dark:border-slate-800 pb-2">Appearance</h2>
                            <div className="flex items-center justify-between py-2">
                                <div>
                                    <div className="font-medium">Theme</div>
                                    <div className="text-sm text-slate-500">Choose light or dark mode</div>
                                </div>
                                <Button variant="outline" onClick={toggleTheme} icon={settings.theme === 'light' ? Moon : Sun}>
                                    {settings.theme === 'light' ? 'Dark Mode' : 'Light Mode'}
                                </Button>
                            </div>
                        </Card>

                        <Card>
                            <h2 className="text-lg font-semibold mb-4 border-b border-slate-100 dark:border-slate-800 pb-2">Report Format</h2>
                            <div className="space-y-4">
                                <Input 
                                    label="Report Title" 
                                    value={settings.reportTitle}
                                    onChange={e => setSettings(prev => ({...prev, reportTitle: e.target.value}))}
                                />
                                <Input 
                                    label="Greeting (Optional)" 
                                    placeholder="e.g. Sir," 
                                    value={settings.greeting}
                                    onChange={e => setSettings(prev => ({...prev, greeting: e.target.value}))}
                                />
                                <Input 
                                    label="Closing Message" 
                                    value={settings.closingMessage}
                                    onChange={e => setSettings(prev => ({...prev, closingMessage: e.target.value}))}
                                />
                                <div className="grid grid-cols-2 gap-4">
                                    <Input 
                                        label="Currency Symbol" 
                                        value={settings.currency}
                                        onChange={e => setSettings(prev => ({...prev, currency: e.target.value}))}
                                    />
                                </div>
                                
                                <div className="pt-2 space-y-3">
                                    <label className="flex items-center gap-3 cursor-pointer">
                                        <input type="checkbox" checked={settings.carryForwardBalance} onChange={e => setSettings(prev => ({...prev, carryForwardBalance: e.target.checked}))} className="w-5 h-5 rounded text-primary focus:ring-primary" />
                                        <span>Auto carry forward closing balance</span>
                                    </label>
                                    <label className="flex items-center gap-3 cursor-pointer">
                                        <input type="checkbox" checked={settings.showCategories} onChange={e => setSettings(prev => ({...prev, showCategories: e.target.checked}))} className="w-5 h-5 rounded text-primary focus:ring-primary" />
                                        <span>Show categories in WhatsApp message</span>
                                    </label>
                                    <label className="flex items-center gap-3 cursor-pointer">
                                        <input type="checkbox" checked={settings.showNotes} onChange={e => setSettings(prev => ({...prev, showNotes: e.target.checked}))} className="w-5 h-5 rounded text-primary focus:ring-primary" />
                                        <span>Show expense notes in WhatsApp message</span>
                                    </label>
                                </div>
                            </div>
                        </Card>

                        <Card>
                            <h2 className="text-lg font-semibold mb-4 border-b border-slate-100 dark:border-slate-800 pb-2">Data Management</h2>
                            <div className="space-y-4">
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <Button variant="outline" onClick={handleExport} icon={Download} className="flex-1">Backup Data</Button>
                                    <input type="file" ref={fileInputRef} onChange={handleImport} accept=".json" className="hidden" />
                                    <Button variant="outline" onClick={() => fileInputRef.current?.click()} icon={Upload} className="flex-1">Restore Data</Button>
                                </div>
                                <div className="pt-4 border-t border-red-100 dark:border-red-900/20">
                                    <Button variant="danger" onClick={handleClearAll} icon={Trash2} className="w-full">Clear All Data</Button>
                                </div>
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentTab, setCurrentTab] = useState('dashboard');
            const [editingReportId, setEditingReportId] = useState(null);
            
            // UI & PWA States
            const [showSplash, setShowSplash] = useState(true);
            const [installPrompt, setInstallPrompt] = useState(null);
            const [isStandalone, setIsStandalone] = useState(
                window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone
            );
            const [showInstallGuide, setShowInstallGuide] = useState(false);
            const showInstallButton = !isStandalone;
            
            // Initialize states from local storage
            const [reports, setReports] = useLocalStorage('expenses_reports', SAMPLE_DATA);
            const [settings, setSettings] = useLocalStorage('expenses_settings', DEFAULT_SETTINGS);

            // Apply theme on mount and when settings change
            useEffect(() => {
                if (settings.theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [settings.theme]);

            // Splash Screen & PWA Install Prompt Logic
            useEffect(() => {
                // Remove splash screen after animation completes
                const splashTimer = setTimeout(() => {
                    setShowSplash(false);
                }, 2500);

                // Listen for PWA install prompt
                const handleBeforeInstallPrompt = (e) => {
                    e.preventDefault(); // Prevent automatic prompt
                    setInstallPrompt(e); // Store event to trigger manually
                };
                
                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                
                window.addEventListener('appinstalled', () => {
                    setInstallPrompt(null);
                    setIsStandalone(true);
                });

                // Check standalone mode on mount for Safari/iOS
                if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
                    setIsStandalone(true);
                }

                return () => {
                    clearTimeout(splashTimer);
                    window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                };
            }, []);

            const handleInstall = async () => {
                if (installPrompt) {
                    installPrompt.prompt();
                    const { outcome } = await installPrompt.userChoice;
                    if (outcome === 'accepted') {
                        setInstallPrompt(null);
                        setIsStandalone(true);
                    }
                } else {
                    // Show manual instructions modal if prompt isn't available natively (e.g. iOS)
                    setShowInstallGuide(true);
                }
            };

            const navigate = (tab, id = null) => {
                setCurrentTab(tab);
                setEditingReportId(id);
                window.scrollTo(0, 0);
            };

            const NavItem = ({ tab, icon: Icon, label, hiddenDesktop = false, hiddenMobile = false }) => {
                const isActive = currentTab === tab;
                return (
                    <button 
                        onClick={() => navigate(tab)}
                        className={`flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:p-3 md:px-4 rounded-xl transition-all
                            ${hiddenDesktop ? 'md:hidden' : ''} ${hiddenMobile ? 'hidden md:flex' : ''}
                            ${isActive 
                                ? 'text-primary bg-primary/10 font-semibold' 
                                : 'text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800'}`}
                    >
                        <Icon size={isActive ? 24 : 22} className="md:w-5 md:h-5 transition-transform" />
                        <span className="text-[10px] md:text-sm font-medium">{label}</span>
                    </button>
                );
            };

            return (
                <ToastProvider>
                    {/* Intro Splash Screen */}
                    {showSplash && (
                        <div className="fixed inset-0 z-[100] bg-primary flex flex-col items-center justify-center text-white splash-container">
                            <div className="splash-logo flex flex-col items-center gap-5">
                                <div className="bg-white/10 p-6 rounded-3xl backdrop-blur-md shadow-2xl border border-white/20">
                                    <Files size={64} className="drop-shadow-lg text-white" />
                                </div>
                                <div className="text-center">
                                    <h1 className="text-4xl font-extrabold tracking-tight drop-shadow-sm mb-2">Daily Expenses</h1>
                                    <p className="text-indigo-200 font-medium tracking-wide">Smart Finance Tracking</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="min-h-screen flex flex-col md:flex-row bg-background-light dark:bg-background-dark">
                        
                        {/* Desktop Sidebar */}
                        <aside className="hidden md:flex flex-col w-64 fixed inset-y-0 left-0 bg-surface-light dark:bg-surface-dark border-r border-slate-200 dark:border-slate-800 z-30">
                            <div className="p-6">
                                <div className="flex items-center gap-3 text-primary font-bold text-xl">
                                    <div className="bg-primary text-white p-2 rounded-lg">
                                        <Files size={24} />
                                    </div>
                                    Daily Expenses
                                </div>
                            </div>
                            <nav className="flex-1 px-4 space-y-2">
                                <NavItem tab="dashboard" icon={Home} label="Dashboard" />
                                <NavItem tab="new" icon={PlusCircle} label="Add Expense" />
                                <NavItem tab="history" icon={HistoryIcon} label="History" />
                            </nav>
                            <div className="p-4 border-t border-slate-200 dark:border-slate-800 space-y-2">
                                {/* Sidebar Install Icon */}
                                {showInstallButton && (
                                    <button onClick={handleInstall} className="w-full flex items-center gap-3 p-3 rounded-xl text-primary bg-primary/10 hover:bg-primary/20 font-medium transition-colors">
                                        <Download size={22} className="w-5 h-5" />
                                        <span className="text-sm">Install App</span>
                                    </button>
                                )}
                                <NavItem tab="settings" icon={SettingsIcon} label="Settings" />
                            </div>
                        </aside>

                        {/* Main Content Area */}
                        <main className="flex-1 md:ml-64 min-h-screen">
                            {currentTab === 'dashboard' && <DashboardView reports={reports} onNavigate={navigate} settings={settings} showInstallButton={showInstallButton} onInstall={handleInstall} />}
                            {currentTab === 'new' && <DailyReportView reports={reports} setReports={setReports} settings={settings} editingId={editingReportId} onNavigate={navigate} />}
                            {currentTab === 'history' && <HistoryView reports={reports} setReports={setReports} settings={settings} onNavigate={navigate} />}
                            {currentTab === 'settings' && <SettingsView settings={settings} setSettings={setSettings} setReports={setReports} />}
                        </main>

                        {/* Mobile Bottom Navigation */}
                        <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-surface-light/90 dark:bg-surface-dark/90 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 flex justify-around items-center p-2 pb-safe z-30 shadow-[0_-5px_10px_rgba(0,0,0,0.05)] dark:shadow-[0_-5px_10px_rgba(0,0,0,0.2)]">
                            <NavItem tab="dashboard" icon={Home} label="Home" />
                            <NavItem tab="new" icon={PlusCircle} label="Add" />
                            <NavItem tab="history" icon={HistoryIcon} label="History" />
                            <NavItem tab="settings" icon={SettingsIcon} label="Settings" />
                        </nav>
                        
                        {/* Manual Install Guide Modal */}
                        <Modal isOpen={showInstallGuide} onClose={() => setShowInstallGuide(false)} title="Install App">
                            <div className="space-y-5 text-slate-600 dark:text-slate-300 pb-2">
                                <p className="text-sm">To install this app on your device for offline access, follow these instructions based on your browser:</p>
                                
                                <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl space-y-2 border border-slate-200 dark:border-slate-700">
                                    <p className="font-semibold text-slate-900 dark:text-white flex items-center gap-2">📱 iOS (Safari)</p>
                                    <ol className="list-decimal pl-5 space-y-2 text-sm">
                                        <li>Tap the <strong>Share</strong> icon <Share2 size={14} className="inline mb-1 mx-1"/> at the bottom of the screen.</li>
                                        <li>Scroll down and tap <strong>Add to Home Screen</strong> <PlusSquare size={14} className="inline mb-1 mx-1"/>.</li>
                                    </ol>
                                </div>
                                
                                <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl space-y-2 border border-slate-200 dark:border-slate-700">
                                    <p className="font-semibold text-slate-900 dark:text-white flex items-center gap-2">🤖 Android (Chrome)</p>
                                    <ol className="list-decimal pl-5 space-y-2 text-sm">
                                        <li>Tap the <strong>Menu</strong> (⋮) icon at the top right.</li>
                                        <li>Tap <strong>Add to Home screen</strong> or <strong>Install app</strong>.</li>
                                    </ol>
                                </div>
                                
                                <Button className="w-full mt-4" onClick={() => setShowInstallGuide(false)}>Got it</Button>
                            </div>
                        </Modal>
                    </div>
                </ToastProvider>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <!-- True Service Worker for Offline PWA Capabilities -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Creates a real caching service worker inline to make the app truly offline capable
                const swCode = `
                    const CACHE_NAME = 'daily-expenses-v1';
                    self.addEventListener('install', function(event) {
                        event.waitUntil(
                            caches.open(CACHE_NAME).then(function(cache) {
                                return cache.addAll([
                                    './',
                                    'https://cdn.tailwindcss.com',
                                    'https://unpkg.com/@babel/standalone/babel.min.js',
                                    'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap'
                                ]).catch(err => console.log('Cache addAll failed', err));
                            })
                        );
                    });
                    self.addEventListener('fetch', function(event) {
                        event.respondWith(
                            caches.match(event.request).then(function(response) {
                                // Return cached version or fetch from network
                                return response || fetch(event.request);
                            }).catch(function() {
                                // Fallback for failed network requests when offline
                                return new Response('Offline Content');
                            })
                        );
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const url = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(url)
                    .then(registration => console.log('PWA ServiceWorker registered perfectly.'))
                    .catch(err => console.log('PWA ServiceWorker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
